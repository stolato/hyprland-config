animations {
    enabled = true

    # 1. Definição das Curvas de Bézier (Velocidade e Aceleração)
    # Sintaxe: bezier = nome, X1, Y1, X2, Y2
    bezier = fluent_decel, 0.1, 1, 0, 1        # Desaceleração suave (estilo Windows 11/GNOME)
    bezier = easeInOutCubic, 0.645, 0.045, 0.355, 1
    bezier = pop_in, 0.15, 1.15, 0.3, 1         # Um leve "bounce" no final para dar vida

    # 2. Aplicação das Animações nos Apps
    # Sintaxe: animation = elemento, ligada(1/0), velocidade, curva, [estilo]
    
    # Abertura de janelas (Aqui está o segredo: popin com 85% do tamanho inicial)
    animation = windowsIn, 1, 3.5, pop_in, popin 85%
    
    # Fechamento de janelas (Mais rápido que a abertura para parecer instantâneo)
    animation = windowsOut, 1, 3, fluent_decel, popin 90%
    
    # Movimentação e Redimensionamento de janelas
    animation = windowsMove, 1, 3.5, fluent_decel
    
    # Fade (Transparência ao abrir/fechar)
    animation = fadeIn, 1, 3, fluent_decel
    animation = fadeOut, 1, 3, fluent_decel
    animation = fadeSwitch, 1, 3.5, easeInOutCubic
    animation = fadeDim, 1, 4, easeInOutCubic
    
    # Transição entre Workspaces
    animation = workspaces, 1, 4, fluent_decel, slide
}
