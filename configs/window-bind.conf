# Mudar o foco entre as janelas usando as setas ou as teclas Vim (H, J, K, L)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Redimensionar janela ativa com SUPER + SHIFT + Setas (Esquerda / Direita)
binde = $mainMod SHIFT, right, resizeactive, 30 0
binde = $mainMod SHIFT, left, resizeactive, -30 0

# Opcional: Adicionar para Cima e para Baixo se quiser o pacote completo
binde = $mainMod SHIFT, up, resizeactive, 0 -30
binde = $mainMod SHIFT, down, resizeactive, 0 30

# Mover a janela física de lugar dentro do mesmo workspace (Tiling)
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# -----------------------------------------------------
# MUDANÇA DE WORKSPACE (Ir para a área de trabalho X)
# -----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Navegação sequencial (Scroll do mouse ou setas com o dedão no ALT)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# Move a janela ativa e LEVA VOCÊ JUNTO para o novo workspace (SHIFT + Número)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move a janela ativa e você CONTINUA no mesmo workspace (ALT + Número)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5

bind = $mainMod, F, fullscreen

# -----------------------------------------------------
# MULTI-MONITOR (Para mover janelas entre HDMI e DP)
# -----------------------------------------------------

# Mover a janela ativa para o monitor da esquerda ou direita
# (Nas versões novas, 'movewindow' detecta a borda do monitor e pula para o próximo)
# Mudar APENAS o foco do teclado/mouse para o monitor ao lado (sem mover a janela)
bind = $mainMod ALT, H, focusmonitor, l
bind = $mainMod ALT, L, focusmonitor, r

# -----------------------------------------------------
# MOUSE TILING (Redimensionar e Arrastar)
# -----------------------------------------------------
# Segure SUPER e use o Botão Esquerdo para arrastar janelas flutuantes
bindm = $mainMod, mouse:272, movewindow
# Segure SUPER e use o Botão Direito para redimensionar qualquer janela
bindm = $mainMod, mouse:273, resizewindow


# -----------------------------------------------------
# TECLAS DE SOM E MÍDIA (Teclado Físico)
# -----------------------------------------------------

# Volume (Usa 'bindel': 'e' repete ao segurar, 'l' funciona com a tela bloqueada)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Mutar o Microfone
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Controle de Música/Vídeos (Play/Pause, Próximo, Anterior)
# Nota: Para esses funcionarem, você precisa instalar o pacote 'playerctl' (sudo dnf install playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
