# =============================================================================
# HYPRLOCK - TELA DE BLOQUEIO CUSTOMIZADA (NOCTALIA DESIGN)
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    dpms_on_empty = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)

    # Blur elegante (Fundo fosco escuro)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------
# INFORMAÇÕES DE TEXTO (DATA E HORA)
# -----------------------------------------------------

# RELÓGIO PRINCIPAL
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = Cantarell Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATA POR EXTENSO
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %d de %B')" </b>"
    color = rgba(200, 200, 200, 0.9)
    font_size = 22
    font_family = Cantarell
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 1
}

# MENSAGEM DE BOAS-VINDAS
label {
    monitor =
    text = Olá, $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = Cantarell
    position = 0, -60
    halign = center
    valign = center
}

# -----------------------------------------------------
# CAMPO DE SENHA
# -----------------------------------------------------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25 # Tamanho das bolinhas da senha
    dots_spacing = 0.2 # Espaçamento entre as bolinhas
    dots_center = true
    
    # Cores
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(40, 200, 40, 0.5) # Cor quando está verificando a senha
    fail_color = rgba(200, 40, 40, 0.5)  # Cor quando erra a senha
    
    fade_on_empty = false
    placeholder_text = <i>🔒 Digite a senha...</i>
    hide_input = false
    
    position = 0, -110
    halign = center
    valign = center
}

