# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua
$mainMod = SUPER
$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun

env = XDG_CURRENT_DESKTOP,GNOME

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, space, exec, qs -c noctalia-shell ipc call launcher toggle
# bind = $mainMod, L, exec, hyprlock
bind = $mainMod, L, exec, hyprlock & sleep 1 && hyprctl dispatch dpms off

# Print
bind = $mainMod SHIFT, P, exec, flatpak run be.alexandervanhee.gradia --screenshot=INTERACTIVE

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/gnome-keyring-daemon --start --components=secrets

# exec-once = hyprpaper
# exec-once = waybar
exec-once = qs -c noctalia-shell
exec-once = hypridle

# window-bind
source = ~/.config/hypr/configs/window-bind.conf

# animation
source = ~/.config/hypr/configs/animation.conf

# noctalia-desing
source = ~/.config/hypr/configs/noctalia-desing.conf


# Configuração universal de monitores (resolução preferida, posição automática, escala 1x)
monitor=,preferred,auto,1

# Se quiser fixar a posição (ex: DP na esquerda, HDMI na direita), use algo assim:
# monitor=DP-1, 1920x1080@144, 0x0, 1
# monitor=HDMI-A-1, 1920x1080@60, 1920x0, 1

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

misc {
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = us
    kb_variant = intl

    follow_mouse = 1
    sensitivity = 0 
}

